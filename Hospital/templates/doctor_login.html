{% extends 'base.html' %}
{% load static %}
{% block title %}Doctor Login{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:auto;margin-top:50px;">
  <div class="card-body">
    <h2 class="card-title text-center">Doctor Login</h2>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}" role="alert">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" action="{% url 'doctor_login' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control" name="username" id="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control" name="password" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
    <p class="mt-3 text-center">Not a doctor? <a href="{% url 'log' %}">Go back to regular login</a></p>
  </div>
</div>
{% endblock %}

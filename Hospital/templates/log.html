{% extends 'base.html' %}
{% load static %}
{% block title %}Sign In | Health Center{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 75vh;">
    <div class="col-md-7 col-lg-4">
        <div class="hms-card p-4 p-md-5 my-5 border-0">
            <div class="text-center mb-5">
                <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-circle mb-3 shadow-sm" style="width: 56px; height: 56px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
                </div>
                <h3 class="fw-bold mb-2">Welcome Back</h3>
                <p class="text-muted-custom">Sign in to your patient portal</p>
            </div>
            
            {% if error %}
            <div class="alert alert-danger py-3 text-center mb-4" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'log' %}">
                {% csrf_token %}
                <div class="mb-4">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control form-control-lg" id="username" name="username" placeholder="Enter your username" required autofocus>
                </div>
                <div class="mb-5">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control form-control-lg" id="password" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 py-3 mb-4">Sign In</button>
            </form>
            
            <div class="text-center pt-3 border-top">
                <p class="text-muted-custom mb-3">Don't have an account? <a href="{% url 'register' %}" class="text-primary-custom fw-bold text-decoration-none">Register</a></p>
                <a href="{% url 'doctor_login' %}" class="text-decoration-none" style="color: var(--secondary-color); font-size: 0.875rem; font-weight: 500;">Staff Login Portal</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}

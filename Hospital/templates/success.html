{% extends 'base.html' %}
{% block title %}Confirmation | Health Center{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5" style="min-height: 50vh; align-items: center;">
    <div class="col-md-6 text-center">
        <div class="hms-card p-5 border-0 shadow-premium position-relative overflow-hidden">
            <div class="position-absolute top-0 start-0 w-100 bg-success" style="height: 6px;"></div>
            <div class="mb-4 text-success d-flex justify-content-center">
                <div class="bg-success text-white rounded-circle d-flex align-items-center justify-content-center shadow-md" style="width: 80px; height: 80px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                </div>
            </div>
            <h3 class="fw-bold mb-3 text-dark">Appointment Confirmed!</h3>
            <p class="text-muted-custom mb-4" style="font-size: 1.1rem;">Your request has been processed securely. We look forward to seeing you.</p>
            
            <div class="d-flex justify-content-center gap-3">
                <a href="{% url 'index' %}" class="btn btn-outline-secondary px-4 py-2 fw-semibold rounded-pill">Return to Home</a>
                <button id="generateInvoiceBtn" class="btn btn-primary px-4 py-2 fw-semibold rounded-pill shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    Print Invoice
                </button>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('generateInvoiceBtn').addEventListener('click', function() {
        const btn = this;
        btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span> Generating...';
        btn.disabled = true;
        
        fetch('/api/latest_appointment/')
            .then(response => response.json())
            .then(data => {
                btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><path d="M6 9V2h12v7"></path><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg> Print Invoice';
                btn.disabled = false;
                generateInvoice(data);
            })
            .catch(error => {
                console.error('Error fetching appointment data:', error);
                btn.innerHTML = 'Error fetching data';
            });
    });

    function generateInvoice(data) {
        if (data.error) {
            alert(data.error);
            return;
        }

        const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
        const invoiceId = 'INV-' + Math.floor(100000 + Math.random() * 900000);

        var invoiceContent = `
            <div class="invoice-container">
                <div class="header">
                    <div class="logo">
                        <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="background:#2563eb; border-radius:50%; padding:6px; margin-right:8px;"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
                        <h2 style="margin:0; display:inline-block; vertical-align:middle; color:#0f172a;">Health Center</h2>
                    </div>
                    <div class="invoice-details">
                        <h1 style="margin:0; color:#2563eb;">INVOICE</h1>
                        <p style="margin:5px 0 0 0; color:#64748b;">Invoice #: ${invoiceId}</p>
                        <p style="margin:2px 0 0 0; color:#64748b;">Date: ${today}</p>
                    </div>
                </div>
                
                <div class="patient-info">
                    <h4 style="margin:0 0 10px 0; color:#0f172a; border-bottom:1px solid #e2e8f0; padding-bottom:5px;">Billed To:</h4>
                    <p style="margin:0; font-weight:bold; font-size:18px;">${data.patientName}</p>
                    <p style="margin:5px 0 0 0; color:#64748b;">Scheduled For: <strong style="color:#0f172a;">${data.appointmentDate}</strong></p>
                </div>

                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Description</th>
                            <th style="text-align:right;">Amount</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Medical Consultation & Booking Fee</td>
                            <td style="text-align:right;">$${data.totalCost.toFixed(2)}</td>
                        </tr>
                        ${data.services.map(service => `
                        <tr>
                            <td>${service} - Standard Setup</td>
                            <td style="text-align:right;">Included</td>
                        </tr>`).join('')}
                    </tbody>
                    <tfoot>
                        <tr>
                            <td style="text-align:right; font-weight:bold;">Total Amount Due:</td>
                            <td style="text-align:right; font-weight:bold; font-size:18px; color:#2563eb;">$${data.totalCost.toFixed(2)}</td>
                        </tr>
                    </tfoot>
                </table>

                <div class="footer">
                    <p>Thank you for choosing Health Center.</p>
                    <p>Please retain this invoice for your medical records.</p>
                </div>
                <div class="no-print" style="text-align:center; margin-top:40px;">
                    <button onclick="window.print()" style="background:#2563eb; color:white; border:none; padding:12px 24px; border-radius:50px; font-weight:bold; font-size:16px; cursor:pointer; box-shadow:0 4px 6px rgba(37,99,235,0.2);">Print Invoice</button>
                </div>
            </div>
        `;

        var invoiceWindow = window.open('', '_blank', 'width=800,height=900');
        invoiceWindow.document.write(`
            <!DOCTYPE html>
            <html>
            <head>
                <title>Invoice - ${data.patientName}</title>
                <style>
                    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
                    body {
                        font-family: 'Plus Jakarta Sans', sans-serif;
                        color: #334155;
                        margin: 0;
                        padding: 40px;
                        background: #f8fafc;
                    }
                    .invoice-container {
                        max-width: 700px;
                        margin: 0 auto;
                        background: white;
                        padding: 50px;
                        border-radius: 16px;
                        box-shadow: 0 10px 25px rgba(0,0,0,0.05);
                    }
                    .header {
                        display: flex;
                        justify-content: space-between;
                        align-items: flex-start;
                        margin-bottom: 50px;
                    }
                    .invoice-details {
                        text-align: right;
                    }
                    .patient-info {
                        background: #f1f5f9;
                        padding: 20px;
                        border-radius: 8px;
                        margin-bottom: 40px;
                    }
                    .items-table {
                        width: 100%;
                        border-collapse: collapse;
                        margin-bottom: 40px;
                    }
                    .items-table th {
                        background: #f8fafc;
                        color: #64748b;
                        padding: 12px;
                        text-align: left;
                        border-bottom: 2px solid #e2e8f0;
                        text-transform: uppercase;
                        font-size: 12px;
                        letter-spacing: 1px;
                    }
                    .items-table td {
                        padding: 15px 12px;
                        border-bottom: 1px solid #e2e8f0;
                    }
                    .footer {
                        text-align: center;
                        color: #94a3b8;
                        font-size: 14px;
                        border-top: 1px solid #e2e8f0;
                        padding-top: 20px;
                    }
                    @media print {
                        body { background: white; padding: 0; }
                        .invoice-container { box-shadow: none; padding: 20px; }
                        .no-print { display: none !important; }
                    }
                </style>
            </head>
            <body>
                ${invoiceContent}
            </body>
            </html>
        `);
        invoiceWindow.document.close();
    }
</script>
{% endblock %}
